
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>咕咕嘎嘎 · 便利贴</title>
<link rel="stylesheet" href="sticky.css">
<script defer src="memo-client.js"></script><script defer src="sticky.js"></script>
</head>
<body>
<button id="tab" hidden title="展开便利贴" aria-label="展开咕咕嘎嘎便利贴">🐧<span>随手记</span></button>
<main id="note">
<header><span class="brand">🐧 咕咕嘎嘎 <small>随手记</small></span><div class="actions">
<button id="pin" aria-label="取消置顶" aria-pressed="true" title="取消置顶">📌</button>
<button id="fold" title="贴边收起" aria-label="贴边收起">⇥</button>
<button id="hide" title="隐藏便利贴，可从主界面重新打开" aria-label="隐藏便利贴">×</button>
</div></header>
<p class="hint" id="hint">已置顶 · 拖动顶部可移动</p>
<textarea id="text" maxlength="100000" aria-label="便利贴内容" placeholder="先记在这里，慢慢来。&#10;&#10;和咕咕嘎嘎的备忘录同步。" spellcheck="false"></textarea>
<footer><span id="status" role="status" aria-live="polite">正在读取…</span><button id="main" title="打开咕咕嘎嘎主界面">打开待办 ↗</button></footer>
<button id="retry" hidden>合并 / 重试保存</button>
</main>
</body></html>
